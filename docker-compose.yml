services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: clena
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository-root .env}"
      POSTGRES_DB: clena
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clena -d clena"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      PORT: "${PORT:-3000}"
      DATABASE_URL: "postgresql://clena:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository-root .env}@postgres:5432/clena?schema=public"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in the repository-root .env}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in the repository-root .env}"
      JWT_ACCESS_TTL: "${JWT_ACCESS_TTL:-15m}"
      JWT_REFRESH_TTL: "${JWT_REFRESH_TTL:-7d}"
      BCRYPT_SALT_ROUNDS: "${BCRYPT_SALT_ROUNDS:-12}"
      AUTH_THROTTLE_TTL: "${AUTH_THROTTLE_TTL:-60000}"
      AUTH_THROTTLE_LIMIT: "${AUTH_THROTTLE_LIMIT:-5}"
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-}"
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-true}"
      SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL:-}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-}"
      SEED_STAFF_EMAIL: "${SEED_STAFF_EMAIL:-}"
      SEED_STAFF_PASSWORD: "${SEED_STAFF_PASSWORD:-}"
      SEED_USER_EMAIL: "${SEED_USER_EMAIL:-}"
      SEED_USER_PASSWORD: "${SEED_USER_PASSWORD:-}"
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:${PORT:-3000}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://backend:3000
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"

volumes:
  postgres-data:
